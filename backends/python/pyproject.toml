[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "lia-labs-server"
version = "0.1.0"
description = "Lia server SDK: sessions, purchases and signed webhooks, with sync and async clients."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
license = "MIT"
authors = [{name = "Lia Labs"}]
readme = "README.md"

[project.urls]
Documentation = "https://docs.lialabs.org/packages/server"
Source = "https://github.com/The-Lia-Labs/lia-server-python"

[tool.hatch.build.targets.wheel]
packages = ["src/lia_server"]
